name: abastix

services:
  # ============================================================
  # MOTOR DE BASE DE DATOS: Microsoft SQL Server 2022
  # ============================================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-YourStrongPassword2026!}
      MSSQL_PID: "Developer"
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - abastix-network
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SPRING_DATASOURCE_PASSWORD:-YourStrongPassword2026!}" -C -Q "SELECT 1;" ||
          /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "${SPRING_DATASOURCE_PASSWORD:-YourStrongPassword2026!}" -Q "SELECT 1;" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ============================================================
  # INICIALIZADOR SEGURO DE BASE DE DATOS: AbastixDB Init
  # ============================================================
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    entrypoint: ["/bin/bash", "/scripts/init-database.sh"]
    environment:
      MSSQL_HOST: "sqlserver"
      MSSQL_PORT: "1433"
      MSSQL_SA_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-YourStrongPassword2026!}
      APP_DB_USER: ${SPRING_DATASOURCE_USERNAME:-sa}
      APP_DB_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-YourStrongPassword2026!}
    volumes:
      - ./sql:/sql:ro
      - ./scripts:/scripts:ro
    networks:
      - abastix-network
    depends_on:
      sqlserver:
        condition: service_healthy

  # ============================================================
  # BROKER DE MENSAJERIA: RabbitMQ con Management Plugin
  # ============================================================
  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${SPRING_RABBITMQ_USERNAME:-abastix}
      RABBITMQ_DEFAULT_PASS: ${SPRING_RABBITMQ_PASSWORD:-AbastixRabbit2026!}
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - abastix-network
    healthcheck:
      test:
        - "CMD-SHELL"
        - "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_local_alarms"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # ============================================================
  # BACKEND API: Java 21 / Spring Boot
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: "8088"
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=AbastixDB;encrypt=true;trustServerCertificate=true;"
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-sa}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-YourStrongPassword2026!}
      SPRING_RABBITMQ_HOST: "rabbitmq"
      SPRING_RABBITMQ_PORT: "5672"
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:-abastix}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD:-AbastixRabbit2026!}
      RABBITMQ_AUTO_STARTUP: "true"
      JWT_SECRET: ${JWT_SECRET:-AbastixEnterpriseSecureSecretKey2026ParaFirmaJWTDeAccesoYRefresco}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      JWT_COOKIE_SECURE: "false"
      JWT_COOKIE_SAME_SITE: "Lax"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,https://abastix.vercel.app}
    ports:
      - "${SERVER_PORT:-8088}:8088"
    networks:
      - abastix-network
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "curl -f http://localhost:8088/api/auth/csrf || exit 1"
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ============================================================
  # FRONTEND WEB: React 19 + Vite + Nginx Reverse Proxy
  # ============================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    networks:
      - abastix-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -qO- http://127.0.0.1:5173/ || exit 1"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  abastix-network:
    driver: bridge

volumes:
  sqlserver_data:
    driver: local
  rabbitmq_data:
    driver: local
