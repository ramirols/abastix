# ============================================================
# CONFIGURACION PRINCIPAL DE ABASTIX (SPRING BOOT)
# ============================================================

# Servidor HTTP (Puerto 8088 por defecto para evitar colision con Apache 8080)
server.port=${SERVER_PORT:8088}

# Aplicacion
spring.application.name=abastix

# Base de datos Microsoft SQL Server
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=AbastixDB;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:abastix_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:AbastixPassword2026!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Seguridad y JWT
jwt.secret=${JWT_SECRET:AbastixEnterpriseSecureSecretKey2026ParaFirmaJWTDeAccesoYRefresco}
jwt.access-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}
jwt.cookie-name=access_token
jwt.cookie-secure=${JWT_COOKIE_SECURE:false}
jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:Lax}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,https://abastix.vercel.app}

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}
# Si RabbitMQ no esta activo en local, no bloquear el inicio del contenedor
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_AUTO_STARTUP:false}

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Logs
logging.level.com.proyecto.abastix=INFO
logging.level.org.springframework.security=WARN
