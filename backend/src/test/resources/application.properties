# ============================================================
# CONFIGURACION DE PRUEBAS AUTOMATIZADAS (H2 IN-MEMORY)
# ============================================================

server.port=0
spring.application.name=abastix-test

# Base de datos en memoria H2
spring.datasource.url=jdbc:h2:mem:abastix_test;DB_CLOSE_DELAY=-1;MODE=MSSQLServer
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# JWT para pruebas
jwt.secret=AbastixTestSuperSecretKeyParaPruebasUnitarias2026DeAlMenos32Bytes!
jwt.access-expiration-ms=3600000
jwt.refresh-expiration-ms=86400000
jwt.cookie-name=access_token
jwt.cookie-secure=false
jwt.cookie-same-site=Lax

# Desactivar listeners RabbitMQ en pruebas
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
